# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ec"
BBFILE_PATTERN_ec = "^${LAYERDIR}/"
# Higher than meta-voltumna (20): our bbappends (systemd, grub-bootconf,
# procps, pam...) must win over the base distro ones.
BBFILE_PRIORITY_ec = "22"

LAYERSERIES_COMPAT_ec = "kirkstone"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_ec = "1"

LAYERDEPENDS_ec = "core meta-voltumna intel amd-bsp elettra"
