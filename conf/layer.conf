# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ec"
BBFILE_PATTERN_ec = "^${LAYERDIR}/"
# Higher than meta-voltumna (20): our bbappends (u-boot, device-tree, users,
# linux...) must win over the base distro ones.
BBFILE_PRIORITY_ec = "22"

LAYERSERIES_COMPAT_ec = "whinlatter wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_ec = "1"

LAYERDEPENDS_ec = "core meta-voltumna elettra kria-bsp kria-core artesyn"

# meta-kria-apps ROS 2 recipes need meta-ros (classes/ros_distro_jazzy.bbclass
# and friends), which is not part of this build. Mask them so the rest of the
# layer parses and builds. To re-enable: add meta-ros (branch scarthgap) with
# the meta-ros-common, meta-ros2 and meta-ros2-jazzy layers to BBLAYERS and
# drop these entries.
# NOTE: keep this out of conf/distro/ec.conf: the FSBL/PMU multiconfigs use
# the xilinx-standalone distro and never see that file.
BBMASK:append = " \
		meta-kria-apps/recipes-apps/foc-motor-ctrl/kria-motor-control.bb \
		meta-kria-apps/recipes-apps/ros-tsn-pubsub/ \
		meta-kria-apps/recipes-containers/container-foc-motor-ctrl/container-foc-motor-ctrl-ros2-canopen.bb \
		meta-kria-apps/recipes-containers/container-foc-motor-ctrl/container-foc-motor-ctrl-ros2-canopen-dev.bb \
		meta-kria-apps/recipes-containers/container-tsn/container-tsn-rs485pmod.bb \
		"
